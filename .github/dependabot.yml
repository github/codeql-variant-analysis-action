# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "@actions/*"
    labels:
      - "Rebuild"
    # ESLint 10 is blocked only by eslint-plugin-github's transitive
    # eslint-plugin-import and eslint-plugin-jsx-a11y peers, with no upstream
    # support currently signaled. This repo itself lints clean on ESLint 10;
    # lift both ignores together once those plugins support it.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
        update-types:
          - "major"
          - "minor"
          - "patch"
      actions:
        patterns:
          - "@actions/*"
      octokit:
        patterns:
          - "@octokit/*"
        update-types:
          - "minor"
          - "patch"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
